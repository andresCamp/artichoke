name: Artichoke

options:
  bundleIdPrefix: dev.serdna.artichoke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# ─────────────────────────────────────────────────────────────────────────────
# Set your Apple Developer Team ID here once. Find it with:
#   security find-identity -v -p codesigning      (the 10-char ID in the cert)
#   or Xcode ▸ Settings ▸ Accounts ▸ your team.
# Everything else (app group, XPC mach service) derives from the signing team
# at runtime, so this is the ONLY place you edit.
# ─────────────────────────────────────────────────────────────────────────────
settings:
  base:
    DEVELOPMENT_TEAM: P62A3QS593
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: true
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Andrés Campos. Source-available, PolyForm Noncommercial 1.0.0."

schemes:
  ArtichokeTests:
    build:
      targets:
        ArtichokeTests: [test]
    test:
      targets:
        - ArtichokeTests

targets:
  Artichoke:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serdna.artichoke
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "DevID dev.serdna.artichoke"
        ENABLE_APP_SANDBOX: false   # Developer ID firewall app runs unsandboxed
    dependencies:
      - target: ArtichokeFilter
        embed: true                 # system extension embedded in Contents/Library/SystemExtensions

  ArtichokeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      # Compile the units under test directly into the bundle — no host app,
      # so the identity + verdict logic runs as a fast logic-only test.
      - path: Sources/Shared/ProcessIdentity.swift
      - path: Sources/Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serdna.artichoke.tests
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"

  ArtichokeFilter:
    type: system-extension         # NEFilterDataProvider, activated via
                                   # OSSystemExtensionRequest. Packaged as
                                   # .systemextension in Contents/Library/
                                   # SystemExtensions (sysextd only scans
                                   # there). No main.swift: entry point is
                                   # the NetworkExtension → NEProviderClasses
                                   # principal class (NSExtensionMain
                                   # semantics, same as the appex form).
    platform: macOS
    sources:
      - Sources/Extension
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serdna.artichoke.filter
        INFOPLIST_FILE: Config/Extension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "DevID dev.serdna.artichoke.filter"
        # A NetworkExtension system extension's executable name MUST equal its
        # bundle identifier (sysextd matches service path to bundle id, else it
        # rejects with the generic "cannot allow apps outside /Applications").
        PRODUCT_NAME: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        # Entry point is the default `_main` (Sources/Extension/main.swift),
        # which calls NEProvider.startSystemExtensionMode(). Do NOT force
        # -e _NSExtensionMain: that is the appex/PlugInKit bootstrap and
        # aborts in xpc_main for a system extension (no XPCService plist).
        # Apple Silicon host; arm64-only system extension is fully supported.
        EXCLUDED_ARCHS: x86_64
